<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Color Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Assets/Favicon icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Color Generator</title>
      </head>
      <body>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <header>
          <div class="brand">
            <div class="brand-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 3C7.03 3 3 6.58 3 11c0 3.09 2.02 5.5 5 5.94V19c0 .55.45 1 1 1 .2 0 .38-.06.55-.16C11.2 19.2 13 17.02 13 14.5c0-.27-.02-.54-.06-.8.4.07.83.1 1.06.1 2.76 0 5-1.79 5-4 0-3.87-3.13-6.8-7-6.8Z"
                  fill="white"
                  opacity="0.95"
                />
                <circle cx="8" cy="9" r="1.1" fill="#7c3aed" />
                <circle cx="12" cy="7" r="1.1" fill="#3b82f6" />
                <circle cx="15.5" cy="10" r="1.1" fill="#22d3ee" />
              </svg>
            </div>
            <div class="brand-name">Color <span>Generator</span></div>
          </div>

          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle theme"
          >
            <svg
              id="themeIcon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>

        <main>
          <h1>Color <span class="accent">Generator</span></h1>
          <p class="subtitle">
            Generate beautiful colors, explore endless combinations, and find
            the perfect shade for your next project.
          </p>

          <div class="divider-row">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line right"></div>
          </div>

          <div class="panel">
            <div class="swatch" id="swatch">
              <p class="hex-value" id="hexValue">#22C55E</p>
              <button class="color-name-row" id="copyHexRow">
                <span id="colorName">Green</span>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <rect
                    x="9"
                    y="9"
                    width="12"
                    height="12"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <path
                    d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
              </button>
            </div>

            <div class="actions">
              <button class="btn btn-generate" id="generateBtn">
                <svg
                  id="refreshIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M21 12a9 9 0 1 1-2.64-6.36"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <path
                    d="M21 3v6h-6"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Generate
              </button>
              <button class="btn btn-secondary" id="copyBtn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <rect
                    x="9"
                    y="9"
                    width="12"
                    height="12"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <path
                    d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                Copy Hex
              </button>
              <button class="btn btn-secondary" id="saveBtn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle cx="13.5" cy="6.5" r="1" fill="currentColor" />
                  <circle cx="17.5" cy="10.5" r="1" fill="currentColor" />
                  <circle cx="8.5" cy="7.5" r="1" fill="currentColor" />
                  <circle cx="6.5" cy="12.5" r="1" fill="currentColor" />
                  <path
                    d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3c2.1 0 3.7-1.6 3.7-3.7C21 6.7 17 2 12 2Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                </svg>
                Save Color
              </button>
            </div>
          </div>
        </main>

        <div class="toast" id="toast">Copied to clipboard</div>
      </body>
    </html>
  </body>
</html>
